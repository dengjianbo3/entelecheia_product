[mypy]
# Strict mode: no implicit Any, no untyped defs, etc.
# Per CONTRIBUTING.md §"Quality gates": mypy must pass on packages/.
python_version = 3.11
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true

# Tests are slightly less strict (fixtures, parametrize, etc.)
[mypy-tests.*]
disallow_untyped_defs = false
disallow_untyped_decorators = false

# studio-client's pseudo fixtures may carry untyped dict literals
[mypy-packages.studio_client.fixtures.*]
disallow_any_generics = false
