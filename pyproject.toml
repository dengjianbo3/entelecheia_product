[project]
name = "entelecheia-product"
version = "0.0.1"
description = "User-facing application platform for the Entelecheia three-project stack — multi-vertical mother ship over studio"
readme = "README.md"
license = {text = "Proprietary"}
authors = [
    {name = "邓剑波", email = "dengjianbo@live.cn"},
]
requires-python = ">=3.11"
keywords = ["llm", "agent", "deliberation", "vertical-platform", "entelecheia"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

# This is the workspace root. Individual packages live under packages/<pkg-name>/
# (platform-shell, platform-features/*, studio-client, verticals/*, auth-service,
# user-service) and apps live under apps/<app-name>/ (api, frontend). Each has
# its own pyproject.toml. uv handles dependency resolution and editable installs
# across the workspace.

[tool.uv.workspace]
members = [
    "packages/*",
    "packages/platform-features/*",
    "packages/verticals/*",
    "apps/*",
]

[tool.uv]
# Workspace members resolve via path; only dev-time tooling here.
dev-dependencies = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",       # for testing FastAPI routes
]

[build-system]
# This root pyproject is metadata-only — no build target.
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = []
