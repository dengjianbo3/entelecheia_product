name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install workspace
        run: uv sync --all-packages

      - name: Lint
        run: uv run ruff check packages apps

      - name: Format check
        run: uv run ruff format --check packages apps

      - name: Type check
        run: uv run mypy packages

      - name: Tests
        run: uv run pytest

      - name: Purity gate (no engine internals; no business words in platform-*; vertical isolation)
        run: bash scripts/check-purity.sh

  frontend-quality-gates:
    runs-on: ubuntu-latest
    # Frontend quality gates run only when frontend code exists. The conditional
    # keeps Day 0 CI green; once apps/frontend/package.json lands the job runs.
    if: hashFiles('apps/frontend/package.json') != ''
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build
