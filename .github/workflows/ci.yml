name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Doc-only / config-only pushes do not trigger CI. Spec-writing during the
    # planning phase produces ~1 commit per push under docs/specs/; running the
    # full quality gate stack on those is wasteful AND used to manifest as
    # noisy "failure" emails (16 over Day 0 + spec phase). paths-ignore
    # bypasses the trigger entirely for these paths.
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE.PROPRIETARY"
      - ".claude/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
      - "LICENSE.PROPRIETARY"
      - ".claude/**"

jobs:
  # Always-runs job. Two roles:
  #   1. Detects what kind of source code exists (Python / Frontend) and
  #      exposes flags via job outputs. Downstream jobs gate on these
  #      outputs in their own `if:` — the only way to do conditional jobs
  #      since hashFiles() is not allowed in job-level `if:` (this was the
  #      original Day 0 bug: every CI run from 2026-04-29 to 2026-05-02
  #      failed with 0 jobs because hashFiles in `if:` is a parser error
  #      that GitHub silently rejects the whole workflow over).
  #   2. Runs scripts/check-purity.sh in CI for real (not just locally) and
  #      verifies repo-level invariants. Guarantees ≥1 job per CI invocation,
  #      so the run never reports the "0 jobs" failure mode again.
  scaffolding-check:
    runs-on: ubuntu-latest
    outputs:
      has_python:   ${{ steps.detect.outputs.has_python }}
      has_frontend: ${{ steps.detect.outputs.has_frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect what source exists (output flags for downstream jobs)
        id: detect
        run: |
          set -euo pipefail
          if find packages apps -name '*.py' -type f -print -quit 2>/dev/null | grep -q .; then
            echo "has_python=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_python=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f apps/frontend/package.json ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          fi
          echo "detected: python=$(cat $GITHUB_OUTPUT | grep has_python) frontend=$(cat $GITHUB_OUTPUT | grep has_frontend)"

      - name: Purity gate (no engine internals; no business words in platform-*; vertical isolation; deprecated 'roundtable' naming)
        run: bash scripts/check-purity.sh

      - name: Repo invariants
        run: |
          test -f pyproject.toml
          test -f README.md
          test -f ARCHITECTURE.md
          test -f CONTRIBUTING.md
          test -f scripts/check-purity.sh

  python-quality-gates:
    runs-on: ubuntu-latest
    needs: scaffolding-check
    if: needs.scaffolding-check.outputs.has_python == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install workspace
        run: uv sync --all-packages

      - name: Lint
        run: uv run ruff check packages apps

      - name: Format check
        run: uv run ruff format --check packages apps

      - name: Type check
        run: uv run mypy packages

      - name: Tests
        run: uv run pytest

  frontend-quality-gates:
    runs-on: ubuntu-latest
    needs: scaffolding-check
    if: needs.scaffolding-check.outputs.has_frontend == 'true'
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build
